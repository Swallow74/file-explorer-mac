name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: ./build.sh --universal

      - name: Verify signature
        run: codesign --verify --verbose=2 "build/File Explorer.app"

      - name: Self-test
        run: WINEXP_SELFTEST=1 "build/File Explorer.app/Contents/MacOS/FileExplorer"

      - name: Package
        run: |
          ditto -c -k --keepParent "build/File Explorer.app" FileExplorer-macOS-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FileExplorer-macOS-universal
          path: FileExplorer-macOS-universal.zip
