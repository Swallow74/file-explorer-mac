name: build

on:
  push:
    branches: [main]
  pull_request:

# One runner per branch: a new push replaces the queued run rather than
# piling up behind it.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macos-14 maps to the ARM pool, which GitHub rejects for this account
    # ("configuration macos-14-arm64-us-default is not supported"). The Intel
    # runner still builds both slices; the self-test executes the x86_64 one.
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Select an Xcode the runner actually has
        # The image default may point at a version that was pulled from the
        # machine; SwiftUI's @State macro needs a full Xcode, not just the
        # Command Line Tools.
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_*.app 2>/dev/null | tail -1 || echo /Applications/Xcode.app)
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Build universal app
        run: ./build.sh --universal

      - name: Verify signature
        run: codesign --verify --verbose=2 "build/File Explorer.app"

      - name: Self-test
        run: WINEXP_SELFTEST=1 "build/File Explorer.app/Contents/MacOS/FileExplorer"

      - name: Package
        run: |
          ditto -c -k --keepParent "build/File Explorer.app" FileExplorer-macOS-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FileExplorer-macOS-universal
          path: FileExplorer-macOS-universal.zip
